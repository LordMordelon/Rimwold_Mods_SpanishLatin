name: Compilar traducciones

on:
  push:
    branches:
      - master
    paths:
      - "Archivo Traducciones/**"
      - "Archivo Traducciones Vanilla/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  compilar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Compilar traducciones
        run: |
          python Programas/cli_compilador.py \
            --origen "Archivo Traducciones" \
            --destino "Pack Traducciones [Español Latino]" \
            --idioma "SpanishLatin (Español(Latinoamérica))" \
            --limpiar-destino \
            --eliminar-comentarios \
            --update-about \
            --reporte

      - name: Obtener última versión
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.1.24")
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Incrementar versión (patch)
          TAG=$LATEST_TAG
          if [[ $TAG =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            NEW_PATCH=$((PATCH + 1))
            NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          else
            NEW_TAG="v1.1.25"
          fi
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Preparar paquete beta
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          cd "Pack Traducciones [Español Latino]"
          zip -r "$RUNNER_TEMP/dist/Pack_Traducciones_Espanol_Latino-${{ steps.version.outputs.new_tag }}.zip" .
          cd ..


      - name: Generar release notes
        continue-on-error: true
        run: |
          python Programas/generar_release_notes.py \
            --output "$RUNNER_TEMP/release_notes.md" \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.version.outputs.new_tag }}"

      - name: Crear release notes por defecto
        if: failure()
        run: |
          echo "# Compilación automática de traducciones" > "$RUNNER_TEMP/release_notes.md"
          echo "" >> "$RUNNER_TEMP/release_notes.md"
          echo "Se compilaron 198 mods + 1 parche Vanilla" >> "$RUNNER_TEMP/release_notes.md"

      - name: Push cambios compilados
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Compilar traducciones [skip ci]"
            git tag "${{ steps.version.outputs.new_tag }}"
            git push --atomic origin master "${{ steps.version.outputs.new_tag }}" || true
          else
            echo "Sin cambios para commitear."
          fi

      - name: Publicar release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body_path: ${{ runner.temp }}/release_notes.md
          prerelease: false
          files: |
            ${{ runner.temp }}/dist/Pack_Traducciones_Espanol_Latino-${{ steps.version.outputs.new_tag }}.zip
