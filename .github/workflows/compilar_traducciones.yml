name: Compilar traducciones

on:
  push:
    branches:
      - master
    paths:
      - "Archivo Traducciones/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  compilar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar traducciones
        run: |
          python Programas/cli_compilador.py \
            --origen "Archivo Traducciones" \
            --destino "Pack Traducciones [Español Latino]" \
            --idioma "SpanishLatin (Español(Latinoamérica))" \
            --limpiar-destino \
            --eliminar-comentarios \
            --update-about \
            --reporte

      - name: Preparar paquete beta
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar -cf "$RUNNER_TEMP/dist/Pack_Traducciones_Espanol_Latino.tar" -C "." "Pack Traducciones [Español Latino]"

      - name: Publicar pre-release (beta)
        id: release_drafter
        uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "v1.0.${{ github.run_number }}"
          body: ${{ steps.release_drafter.outputs.body }}
          prerelease: false
          files: |
            ${{ runner.temp }}/dist/Pack_Traducciones_Espanol_Latino.tar

      - name: Commit cambios
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Compilar traducciones [skip ci]"
            git push
          else
            echo "Sin cambios para commitear."
          fi
