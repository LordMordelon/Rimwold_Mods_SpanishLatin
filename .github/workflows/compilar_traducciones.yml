name: Compilar traducciones

on:
  push:
    branches:
      - master
    paths:
      - "Archivo Traducciones/**"
      - "Archivo Traducciones Vanilla/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  compilar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compilar traducciones
        run: |
          python Programas/cli_compilador.py \
            --origen "Archivo Traducciones" \
            --destino "Pack Traducciones [Español Latino]" \
            --idioma "SpanishLatin (Español(Latinoamérica))" \
            --limpiar-destino \
            --eliminar-comentarios \
            --update-about \
            --reporte \
            --git

      - name: Preparar paquete beta
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          tar -cf "$RUNNER_TEMP/dist/Pack_Traducciones_Espanol_Latino.tar" -C "." "Pack Traducciones [Español Latino]"

      - name: Obtener última versión
        id: version
        run: |
          if git describe --tags --exact-match 2>/dev/null; then
            TAG=$(git describe --tags --exact-match)
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.1.23")
          fi
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.current_tag }}
          name: ${{ steps.version.outputs.current_tag }}
          python Programas/generar_release_notes.py \
            --output "$RUNNER_TEMP/release_notes.md"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "v1.0.${{ github.run_number }}"
          body_path: ${{ runner.temp }}/release_notes.md
          prerelease: false
          files: |
            ${{ runner.temp }}/dist/Pack_Traducciones_Espanol_Latino.tar
Push cambios compilados
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Actualizar Pack Traducciones [skip ci]" || true
            git commit -m "Compilar traducciones [skip ci]"
            git push
          else
            echo "Sin cambios para commitear."
          fi
